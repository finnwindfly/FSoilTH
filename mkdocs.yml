site_name: FSoilTH
site_description: A configurable frozen-soil thermo-hydrology model
site_url: https://finnwindfly.github.io/FSoilTH/
repo_name: finnwindfly/FSoilTH
repo_url: https://github.com/finnwindfly/FSoilTH
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/snowflake
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Model:
      - Scope and design: model/overview.md
      - Process hierarchy: model/process-hierarchy.md
  - Cases:
      - Maqu, June 2022: cases/maqu.md
  - Development:
      - Roadmap: development/roadmap.md
      - Code structure: development/code-structure.md
  - References: references.md

copyright: Copyright © Pengfei Xu and FSoilTH contributors.
